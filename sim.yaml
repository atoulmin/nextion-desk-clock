# Desktop preview of the desk clock (SDL window).
# Up/Down = dial, Space = press, R = rotate face, S = second hand mode, W = setup screens.
substitutions:
  face_rotation: "0°"
  setup_ssid: Desk Clock Setup

esphome:
  name: desk-clock-sim
  on_boot:
    priority: -100
    then:
      - script.execute: build_ui
      - if:
          condition:
            lambda: return getenv("CLOCK_SETUP_DEMO") != nullptr;
          then:
            - lambda: desk_clock_setup::show(desk_clock_setup::WIFI, "");
            - delay: 2s
            - lambda: desk_clock_setup::show(desk_clock_setup::HOME_ASSISTANT, "192.168.0.57");
            - delay: 2s
            - lambda: desk_clock_setup::show(desk_clock_setup::NONE, "192.168.0.57");
      - if:
          condition:
            lambda: return getenv("CLOCK_DEMO") != nullptr;
          then:
            - script.execute: demo

host:
  mac_address: "06:35:69:ab:f6:7a"

logger:
  level: INFO

time:
  - platform: host
    id: clock_time

packages:
  common: !include clock_common.yaml

display:
  - platform: sdl
    id: lcd
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      width: 240
      height: 240

binary_sensor:
  - platform: sdl
    id: key_up
    key: SDLK_UP
    on_press:
      - lambda: desk_clock::turned(1);
  - platform: sdl
    id: key_down
    key: SDLK_DOWN
    on_press:
      - lambda: desk_clock::turned(-1);
  - platform: sdl
    id: key_space
    key: SDLK_SPACE
    on_press:
      - lambda: desk_clock::pressed();
  - platform: sdl
    id: key_r
    key: SDLK_r
    on_press:
      - select.next: face_rotation
  - platform: sdl
    id: key_w
    key: SDLK_w
    on_press:
      - lambda: |-
          static int m = 0;
          m = (m + 1) % 3;
          desk_clock_setup::show((desk_clock_setup::Mode) m, "192.168.0.57");
  - platform: sdl
    id: key_s
    key: SDLK_s
    on_press:
      - select.next: second_hand

# Scripted run for screenshots (CLOCK_DEMO=1): t=2 slow clockwise, t=2.6 fast clockwise
# spin, t=3.9 fast anticlockwise spin, t=5.95 press, t=6.2 press again
script:
  - id: demo
    then:
      - select.set: { id: face_rotation, option: "0°" }
      - select.set: { id: second_hand, option: Smooth }
      - delay: 2s
      - repeat:
          count: 4
          then:
            - lambda: desk_clock::turned(1);
            - delay: 150ms
      - repeat:
          count: 20
          then:
            - lambda: desk_clock::turned(1);
            - delay: 25ms
      - delay: 800ms
      - repeat:
          count: 15
          then:
            - lambda: desk_clock::turned(-1);
            - delay: 30ms
      - delay: 1.6s
      - lambda: desk_clock::pressed();
      - delay: 250ms
      - lambda: desk_clock::pressed();
