# Analog desk clock on the Open Nextion ONX2424G013 (ESP32-S3, 1.28" round GC9A01, rotary encoder).
# The clock face lives in clock_face.h. The knob does nothing locally beyond a little
# on-screen feedback: its turns and presses are Home Assistant entities for automations.
#
# Home Assistant entities:
#   light.desk_clock_display        screen on/off and brightness
#   event.desk_clock_button         single_press / double_press / long_press
#   binary_sensor.desk_clock_button raw pressed / released
#   event.desk_clock_dial           clockwise / anticlockwise, one event per detent
#   HA event esphome.desk_clock_dial  {steps: n}, detents added up over 200 ms (+ = clockwise);
#                                     needs "Allow the device to perform Home Assistant actions"
#   config: Second hand (Smooth/Tick/Off), Face rotation, Show date, Knob feedback
substitutions:
  name: desk-clock
  friendly_name: Desk Clock
  # The desk stand holds the knob a quarter turn round from the wall plate
  face_rotation: "90°"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: build_ui

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    # Espressif's LVGL tuning for the S3: optimise for speed and give the caches room,
    # since the display buffers and images live partly in PSRAM
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: y

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  encryption:
    key: !secret desk_clock_api_key

ota:
  - platform: esphome
    password: !secret desk_clock_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Desk Clock Fallback"

captive_portal:

# Home Assistant sets the clock and the time zone; internet time keeps it going without HA
time:
  - platform: homeassistant
    id: clock_time
  - platform: sntp
    id: sntp_time

packages:
  common: !include clock_common.yaml

spi:
  id: lcd_spi
  clk_pin: GPIO5
  mosi_pin: GPIO1

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO6
    # 25 kHz avoids the stripe artefacts the vendor saw at lower PWM rates
    frequency: 25000Hz

light:
  - platform: monochromatic
    id: backlight
    name: Display
    icon: mdi:clock-outline
    output: backlight_pwm
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 500ms
    # No point drawing a clock nobody can see
    on_turn_off:
      - delay: 600ms
      - if:
          condition:
            light.is_off: backlight
          then:
            - lvgl.pause:
    on_turn_on:
      - lvgl.resume:

display:
  - platform: ili9xxx
    id: lcd
    model: GC9A01A
    spi_id: lcd_spi
    cs_pin: GPIO2
    dc_pin: GPIO3
    reset_pin: GPIO8
    dimensions:
      width: 240
      height: 240
    data_rate: 80MHz
    color_order: bgr
    invert_colors: true
    transform:
      mirror_x: true
      mirror_y: false
      swap_xy: false
    auto_clear_enabled: false
    update_interval: never

# Plays the knob animations without touching the knob or sending anything to HA
# (hidden by default). Frame rates are logged at debug level when each one ends.
button:
  - platform: template
    name: Animation test
    entity_category: diagnostic
    disabled_by_default: true
    on_press:
      - repeat:
          count: 4
          then:
            - lambda: desk_clock::turned(1);
            - delay: 150ms
      - repeat:
          count: 20
          then:
            - lambda: desk_clock::turned(1);
            - delay: 25ms
      - delay: 2s
      - repeat:
          count: 15
          then:
            - lambda: desk_clock::turned(-1);
            - delay: 30ms
      - delay: 2.5s
      - lambda: desk_clock::pressed();
      - delay: 2.5s
      - lambda: desk_clock::pressed();
      - delay: 250ms
      - lambda: desk_clock::pressed();

event:
  - platform: template
    id: dial_event
    name: Dial
    icon: mdi:rotate-right
    event_types: [clockwise, anticlockwise]
  - platform: template
    id: button_event
    name: Button
    icon: mdi:gesture-tap-button
    device_class: button
    event_types: [single_press, double_press, long_press]

sensor:
  - platform: rotary_encoder
    id: knob
    internal: true
    pin_a:
      number: GPIO48
      mode: INPUT_PULLUP
    pin_b:
      number: GPIO47
      mode: INPUT_PULLUP
    # Count every detent
    resolution: 2
    on_clockwise:
      - event.trigger: { id: dial_event, event_type: clockwise }
      - lambda: |-
          desk_clock::turned(1);
          id(dial_steps) += 1;
      - if:
          condition:
            not:
              script.is_running: send_dial_steps
          then:
            - script.execute: send_dial_steps
    on_anticlockwise:
      - event.trigger: { id: dial_event, event_type: anticlockwise }
      - lambda: |-
          desk_clock::turned(-1);
          id(dial_steps) -= 1;
      - if:
          condition:
            not:
              script.is_running: send_dial_steps
          then:
            - script.execute: send_dial_steps

  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
    entity_category: diagnostic

# Detents turned but not yet sent to Home Assistant
globals:
  - id: dial_steps
    type: int
    initial_value: "0"

script:
  # Sends the detents in batches: the first goes 200 ms after the turn starts, then
  # every 200 ms while it keeps turning, so a fast spin is a few big steps, not dozens
  - id: send_dial_steps
    mode: single
    then:
      - delay: 200ms
      - if:
          condition:
            lambda: return id(dial_steps) != 0;
          then:
            - homeassistant.event:
                event: esphome.desk_clock_dial
                data_template:
                  steps: "{{ steps | int }}"
                variables:
                  steps: !lambda return id(dial_steps);
            - lambda: id(dial_steps) = 0;

binary_sensor:
  # Knob push button
  - platform: gpio
    id: knob_button
    name: Button
    icon: mdi:gesture-tap-button
    pin:
      number: GPIO9
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
      - delayed_off: 25ms
    on_press:
      - lambda: desk_clock::pressed();
    on_multi_click:
      - timing:
          - ON for at most 400ms
          - OFF for at most 300ms
          - ON for at most 400ms
          - OFF for at least 50ms
        then:
          - event.trigger: { id: button_event, event_type: double_press }
      - timing:
          - ON for at most 400ms
          - OFF for at least 300ms
        then:
          - event.trigger: { id: button_event, event_type: single_press }
      - timing:
          - ON for at least 700ms
        then:
          - event.trigger: { id: button_event, event_type: long_press }
